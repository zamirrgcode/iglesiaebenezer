<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AEV - Iglesia Ebenezer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg,#1a0033,#003366,#004c99); color:#fff; }
    header { padding:100px 20px; text-align:center; }
    header h1 { font-size:3rem; color:#ffd700; }
    section { margin:40px auto; padding:20px; background:rgba(255,255,255,0.08); border-radius:12px; }
    h2 { color:#ffd700; }
    footer { background:rgba(0,0,0,0.9); color:#ffd700; text-align:center; padding:20px; }
    @media (max-width:768px){ header h1{font-size:2rem;} video{max-height:300px;} }
  </style>
</head>
<body>

<header>
  <h1 class="animate__animated animate__fadeInDown">AEV</h1>
  <p class="animate__animated animate__fadeInUp">Adoración y música para todos</p>
</header>

<section class="container">
  <h2>Galería</h2>
  <div class="row mt-4">
    <div class="col-md-4 mb-3"><img src="../../img/aev1.jpg" class="img-fluid rounded shadow" alt="Foto 1"></div>
    <div class="col-md-4 mb-3"><img src="../../img/aev2.jpg" class="img-fluid rounded shadow" alt="Foto 2"></div>
    <div class="col-md-4 mb-3"><img src="../../img/aev3.jpg" class="img-fluid rounded shadow" alt="Foto 3"></div>
  </div>
</section>

<section class="container">
  <h2>Video del evento</h2>
  <video controls width="100%" style="border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.4);">
    <source src="videos/aev.mp4" type="video/mp4">
    Tu navegador no soporta la reproducción de video.
  </video>
</section>

<link rel="stylesheet" href="../style.css">

<footer>
  <p>&copy; 2026 Iglesia Ebenezer – Hasta aquí nos ayudó Jehová</p>
</footer>

</body>
</html>
